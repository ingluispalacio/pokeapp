name: CI (Pruebas Automatizadas)

# Ejecutar esto cada vez que se suba código a main o se abra un Pull Request
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Cambia a tu versión de Node si es necesario
        cache: 'npm'

    - name: Instalar dependencias
      run: npm install

    - name: Correr los tests
      run: npm test # Tu comando de pruebas (ej. Jest, Vitest, etc.)